name: AlphaTech Automated Two-Phase Quantitative Pipeline

on:
  schedule:
    # Fase 1: 1 Jam Setelah Pasar Dibuka (10:10 WIB = 03:10 UTC, Senin - Jumat, menghindari peak 00-min congestion)
    - cron: '10 3 * * 1-5'
    # Fase 2: 1 Jam Setelah Pasar Ditutup (17:15 WIB = 10:15 UTC, Senin - Jumat)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: 'Pilih Mode Eksekusi Pipeline'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - opening_pulse (10:00 WIB - Harga Open & Live Intraday)
          - eod_settlement (17:15 WIB - EOD Settlement & Rekomendasi Penuh)

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Quantitative Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt

      - name: Run Two-Phase Quantitative Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RAW_MODE="${{ github.event.inputs.pipeline_mode || '' }}"
          SCHEDULE="${{ github.event.schedule || '' }}"
          MODE="auto"
          if [[ "$RAW_MODE" == *"opening_pulse"* ]] || [[ "$SCHEDULE" == "10 3 * * 1-5" ]] || [[ "$SCHEDULE" == "0 3 * * 1-5" ]]; then
            MODE="opening_pulse"
          elif [[ "$RAW_MODE" == *"eod_settlement"* ]] || [[ "$SCHEDULE" == "15 10 * * 1-5" ]]; then
            MODE="eod_settlement"
          fi
          echo "Executing pipeline in mode: $MODE (Trigger: RAW_MODE='$RAW_MODE', SCHEDULE='$SCHEDULE')"
          python -m src.pipeline_runner --mode=$MODE

      - name: Commit & Push Processed Alpha Recommendations & Market Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/processed/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quant data & recommendations via GitHub Actions [skip ci]" && git push)
