name: AlphaTech Automated Daily Quantitative Pipeline

on:
  schedule:
    # 1. Sore hari setelah bursa BEI tutup: 10:00 UTC = 17:00 WIB (Senin - Jumat)
    - cron: '0 10 * * 1-5'
    # 2. Pagi hari sebelum bursa buka: 22:00 UTC = 05:00 WIB (Minggu - Kamis)
    - cron: '17 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Quantitative Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt

      - name: Step 1 - Ingest Market Data
        run: python -m src.01_data_ingestion

      - name: Step 2 - Feature Engineering & Alpha Extraction
        run: python -m src.02_feature_eng

      - name: Step 3 - Model Training & Alpha Inference
        run: python -m src.03_model_inference

      - name: Step 3.5 - Institutional Foreign Flow Engine
        run: python -m src.foreign_flow

      - name: Step 4 - Institutional Morning Market Brief & Watchlist Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.morning_brief

      - name: Step 4.5 - Multi-Year Financial Statements & Stock Archetypes
        run: python scripts/generate_financials_summary.py

      - name: Commit & Push Processed Alpha Recommendations & Briefs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/processed/ data/raw/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily alpha recommendations & market database [skip ci]" && git push)

