[tool.pyrefly]
ignore-missing-imports = true
search-paths = [".", "src", "api"]

[tool.pyright]
include = [".", "src", "api"]
extraPaths = [".", "src", "api"]
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"

[tool.pylance]
extraPaths = [".", "src", "api"]

[tool.ruff]
line-length = 120
